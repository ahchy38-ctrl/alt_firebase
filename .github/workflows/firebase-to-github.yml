
name: Export Firebase Realtime Database

on:
  workflow_dispatch:

  schedule:
    # Every day at 02:00 UTC
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: firebase-database-export
  cancel-in-progress: false

jobs:
  export-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # 2. Install Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Retrieve Firebase data and create JSON
      - name: Export Firebase data
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_PATH: /
        run: python scripts/export_firebase.py

      # 5. Commit and push the updated JSON
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/firebase_data.json

          if git diff --cached --quiet; then
            echo "No changes detected. Nothing to push."
            exit 0
          fi

          git commit -m "Update Firebase database export"
          git push origin "HEAD:${GITHUB_REF_NAME}"
